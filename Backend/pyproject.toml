    "drf-spectacular>=0.29.0",
    "gunicorn>=25.3.0",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.3",
    "python-decouple>=3.8",
    "redis>=7.4.0",
    "whitenoise>=6.12.0",
]
